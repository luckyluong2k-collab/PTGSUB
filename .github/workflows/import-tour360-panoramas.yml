name: Import Tour 360 Panoramas

on:
  push:
    branches:
      - agent/tour-360-mvp
    paths:
      - .github/workflows/import-tour360-panoramas.yml
      - tour360/drive-manifest.json
      - tour360/scripts/import_drive_panos.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-tour360-panoramas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-panoramas:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tour-360-mvp
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 gdown==5.2.0

      - name: Download and optimize 14 panoramas
        run: python tour360/scripts/import_drive_panos.py

      - name: Validate generated files
        run: |
          test "$(find tour360/assets/panos -maxdepth 1 -name 'scene-*.jpg' | wc -l)" -eq 14
          du -sh tour360/assets/panos

      - name: Commit panorama assets
        run: |
          if git diff --quiet -- tour360/assets/panos && [ -z "$(git status --short tour360/assets/panos)" ]; then
            echo "Panorama assets are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tour360/assets/panos
          git commit -m "Import 14 optimized panorama images"
          git push origin HEAD:agent/tour-360-mvp
