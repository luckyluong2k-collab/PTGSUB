name: Deploy Tour 360 to vhomes-35a1c Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tour360/**"
      - ".github/workflows/firebase-vhome-deploy.yml"

permissions:
  contents: read

concurrency:
  group: firebase-vhomes-35a1c-live
  cancel-in-progress: true

jobs:
  deploy-vhomes:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Authenticate Firebase
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_PRIMARY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VHOMES_35A1C }}
          FIREBASE_SERVICE_ACCOUNT_FALLBACK: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PTG_SUB }}
        run: |
          FIREBASE_SERVICE_ACCOUNT="${FIREBASE_SERVICE_ACCOUNT_PRIMARY:-$FIREBASE_SERVICE_ACCOUNT_FALLBACK}"
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_VHOMES_35A1C secret."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Prepare standalone Tour 360 release
        shell: bash
        run: |
          rm -rf .firebase-vhomes
          mkdir -p .firebase-vhomes
          cp -R tour360/. .firebase-vhomes/
          rm -rf .firebase-vhomes/scripts
          rm -f .firebase-vhomes/drive-manifest.json
          cat > firebase.vhomes.json <<'JSON'
          {
            "hosting": {
              "public": ".firebase-vhomes",
              "ignore": [
                "firebase.vhomes.json",
                "**/.*",
                "**/node_modules/**"
              ],
              "headers": [
                {
                  "source": "**/*.@(jpg|jpeg|png|webp)",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "public,max-age=31536000,immutable"
                    }
                  ]
                },
                {
                  "source": "**/*.@(html|js|css)",
                  "headers": [
                    {
                      "key": "Cache-Control",
                      "value": "public,max-age=300"
                    }
                  ]
                }
              ],
              "cleanUrls": true,
              "trailingSlash": false
            }
          }
          JSON

      - name: Deploy vhomes-35a1c.web.app
        run: firebase deploy --only hosting --config firebase.vhomes.json --project vhomes-35a1c --non-interactive

      - name: Verify deployment
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            status="$(curl -L --silent --output /dev/null --write-out '%{http_code}' https://vhomes-35a1c.web.app/)"
            echo "Verification attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "vhomes-35a1c.web.app did not return HTTP 200 after deployment."
          exit 1
